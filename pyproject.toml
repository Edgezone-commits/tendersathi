[project]
name = "tendersathi"
version = "0.1.0"
description = "Agentic AI system that matches Nepali SMEs to relevant government tenders"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.60",
    "groq>=0.13.0",
    "pydantic>=2.9.0",
    "supabase>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langfuse>=3.0.0",  # tracing (tendersathi.llm.tracing) needs the v3+ OTEL-based API
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "nepali-datetime>=1.0.8.5",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tendersathi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` is meant to be called in argument defaults
# (src/tendersathi/api/*) -- that's the documented dependency-injection
# pattern, not the mutable-default-argument bug this rule otherwise catches.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
