name: Daily tender digest

on:
  schedule:
    # 03:00 UTC = 08:45 NPT (Nepal Time, UTC+5:45) -- mid-morning in Nepal,
    # after the previous day's manually-uploaded tenders have had a chance
    # to be scored.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  run-daily-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run matcher + notifier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m tendersathi.daily_run
